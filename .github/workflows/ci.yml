name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kotlin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:test

  swift:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apple/MuCore
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 contract/fixtures/generate.py --rescan-check
      - run: python3 contract/fixtures/sync_generate.py --check
      - run: python3 contract/fixtures/err_generate.py --check
