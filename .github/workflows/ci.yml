name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 contract/fixtures/generate.py --rescan-check
      - run: python3 contract/fixtures/sync_generate.py --check
      - run: python3 contract/fixtures/err_generate.py --check
      - run: python3 contract/fixtures/gdrive_generate.py --check
      - run: python3 contract/fixtures/dropbox_generate.py --check
      - run: python3 contract/fixtures/eq_generate.py --check
      - run: python3 contract/fixtures/nowplaying_generate.py --check
      - run: python3 contract/fixtures/oauth_generate.py --check
      - run: python3 contract/fixtures/remotefs_generate.py --check
