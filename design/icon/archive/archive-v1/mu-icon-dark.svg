<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- iOS 18 / macOS 深色外觀變體：同一字標，底色壓暗、字標降到 92% 白避免深色下刺眼 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3C2F7A"/>
      <stop offset="0.45" stop-color="#241E52"/>
      <stop offset="1" stop-color="#0E0B22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.16" r="0.85">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#A78BFA" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <g transform="translate(41,-2)">
    <g fill="none" stroke="#EDEAFF" stroke-width="100" stroke-linecap="round" stroke-linejoin="round">
      <path d="M366 300 V 700"/>
      <path d="M366 440 C 366 639 670 639 670 440 V 300"/>
    </g>
    <ellipse cx="318" cy="700" rx="98" ry="74" fill="#EDEAFF" transform="rotate(-18 318 700)"/>
  </g>
</svg>
