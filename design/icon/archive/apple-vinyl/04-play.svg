<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- 唱片・軸心是播放鍵／青綠。原則：實心盤＋很小的軸心孔（孔一放大就讀成蛋／眼睛／標靶）。
       挖孔一律 fill-rule="evenodd"（Android VectorDrawable 對應 android:fillType="evenOdd"）。 -->
  <defs><linearGradient id="v4" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5BD9CB"/><stop offset="1" stop-color="#0E9488"/></linearGradient></defs>
  <rect width="1024" height="1024" fill="url(#v4)"/>
  <g transform="translate(512,512) scale(1.0000) translate(-512.0,-512.0)">
    <path fill="#FFFFFF" fill-rule="evenodd" d="M 192.0,512.0 A 320.0,320.0 0 0 1 832.0,512.0 A 320.0,320.0 0 0 1 192.0,512.0 Z M 420.2,407.5 L 617.8,512.0 L 420.2,616.5 Z"/>
  </g>
</svg>
