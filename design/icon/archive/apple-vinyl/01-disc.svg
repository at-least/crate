  <rect width="1024" height="1024" fill="url(#v1)"/>
  <g transform="translate(512,512) scale(1.0000) translate(-512.0,-512.0)">
    <path fill="#FFFFFF" fill-rule="evenodd" d="M 192.0,512.0 A 320.0,320.0 0 0 1 832.0,512.0 A 320.0,320.0 0 0 1 192.0,512.0 Z M 466.0,512.0 A 46.0,46.0 0 0 1 558.0,512.0 A 46.0,46.0 0 0 1 466.0,512.0 Z"/>
